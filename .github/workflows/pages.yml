name: Website

# Publishes site/ (one static page) plus the demo videos and images to GitHub Pages: https://zoghlamimostafa.github.io/BrowserForge-MCP/
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/assets/demo*', 'docs/assets/social-preview.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/assets
          cp site/index.html _site/
          cp docs/assets/demo.mp4 docs/assets/demo-poster.png docs/assets/demo-api.mp4 docs/assets/demo-api-poster.png docs/assets/social-preview.png _site/assets/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
