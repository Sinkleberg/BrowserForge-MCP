<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BrowserForge approval</title>
  <link rel="stylesheet" href="popup.css" />
  <style>body { width: auto; min-height: 100vh; } #approvals { margin: 0; } li .row button { min-width: 90px; } kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }</style>
</head>
<body>
  <header><h1>BrowserForge needs your approval</h1></header>
  <section id="approvals" aria-live="assertive"><ul id="approvalList"></ul></section>
  <p id="empty" class="hint" hidden>Nothing waiting. This window closes by itself.</p>
  <p class="hint"><kbd>Enter</kbd> approves the first request, <kbd>Esc</kbd> denies it.</p>
  <script src="approve.js"></script>
</body>
</html>
