<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">BrowserForge MCP overview</title>
  <desc id="d">AI agents such as Claude Code and Codex talk MCP over local HTTP to the BrowserForge daemon, which talks over a WebSocket to a browser extension in Firefox or Chrome. A human approval gate guards consequential actions. Captured traffic becomes endpoints, an OpenAPI spec and generated API clients.</desc>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb347"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .muted { fill: #8b949e; }
    .cap { font-size: 12px; letter-spacing: 2px; fill: #8b949e; font-weight: 600; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 12px; fill: #8b949e; }
    .line { stroke: #8b949e; stroke-width: 2; fill: none; }
  </style>

  <!-- canvas -->
  <rect width="1280" height="720" rx="24" fill="#0d1117"/>
  <rect width="1280" height="720" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="718" rx="23" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- title -->
  <text x="60" y="84" font-size="44" font-weight="800" fill="url(#brand)" style="fill:url(#brand)">BrowserForge MCP</text>
  <text x="60" y="118" font-size="19" class="muted">Local-first browser automation and API reverse-engineering for AI agents</text>

  <!-- ============ column 1: agents ============ -->
  <text x="60" y="172" class="cap">AI AGENTS</text>

  <g>
    <rect x="60" y="192" width="240" height="76" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="98" cy="230" r="20" fill="#ffb347" fill-opacity="0.16" stroke="#ffb347" stroke-width="2"/>
    <text x="98" y="235" font-size="13" font-weight="700" text-anchor="middle" style="fill:#ffb347">&gt;_</text>
    <text x="130" y="226" class="h">Claude Code</text>
    <text x="130" y="246" class="s">MCP client</text>

    <rect x="60" y="284" width="240" height="76" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="98" cy="322" r="20" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-width="2"/>
    <text x="98" y="327" font-size="13" font-weight="700" text-anchor="middle" style="fill:#3fb950">&gt;_</text>
    <text x="130" y="318" class="h">OpenAI Codex</text>
    <text x="130" y="338" class="s">MCP client</text>

    <rect x="60" y="376" width="240" height="76" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="98" cy="414" r="20" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="2"/>
    <text x="98" y="419" font-size="13" font-weight="700" text-anchor="middle" style="fill:#58a6ff">&gt;_</text>
    <text x="130" y="410" class="h">Any MCP client</text>
    <text x="130" y="430" class="s">your own agent</text>
  </g>

  <!-- agents -> daemon -->
  <path class="line" d="M300 230 H340 V322 M300 322 H340 M300 414 H340 V322"/>
  <path class="line" d="M340 322 H434" marker-end="url(#arrow)"/>
  <text x="388" y="306" font-size="12" font-weight="600" text-anchor="middle">MCP</text>
  <text x="388" y="342" class="s" text-anchor="middle">Bearer</text>

  <!-- ============ column 2: daemon ============ -->
  <text x="440" y="172" class="cap">LOCAL DAEMON</text>
  <rect x="440" y="192" width="360" height="318" rx="16" fill="#161b22" stroke="#ffb347" stroke-width="2"/>
  <text x="464" y="226" font-size="18" font-weight="700">browserforge daemon</text>
  <text x="464" y="246" class="s">127.0.0.1:7345  ·  no cloud, no API credits</text>

  <g>
    <rect x="460" y="262" width="320" height="52" rx="10" fill="#0d1117" stroke="#30363d"/>
    <circle cx="482" cy="288" r="6" fill="#58a6ff"/>
    <text x="500" y="284" class="h">MCP server</text>
    <text x="500" y="302" class="s">strict schemas · redacted output</text>

    <rect x="460" y="324" width="320" height="52" rx="10" fill="#0d1117" stroke="#30363d"/>
    <circle cx="482" cy="350" r="6" fill="#3fb950"/>
    <text x="500" y="346" class="h">BrowserHub</text>
    <text x="500" y="364" class="s">request ids · timeouts · cancel / resume</text>

    <rect x="460" y="386" width="320" height="52" rx="10" fill="#0d1117" stroke="#30363d"/>
    <circle cx="482" cy="412" r="6" fill="#bc8cff"/>
    <text x="500" y="408" class="h">NetworkStore</text>
    <text x="500" y="426" class="s">in-memory capture · HAR import / export</text>

    <rect x="460" y="448" width="320" height="52" rx="10" fill="#0d1117" stroke="#30363d"/>
    <circle cx="482" cy="474" r="6" fill="#ffb347"/>
    <text x="500" y="470" class="h">Analyzer + client generator</text>
    <text x="500" y="488" class="s">deterministic · evidence and confidence per fact</text>
  </g>

  <!-- daemon <-> browser -->
  <path class="line" d="M804 322 H876" stroke="#ffb347" marker-start="url(#arrow-o)" marker-end="url(#arrow-o)"/>
  <text x="840" y="304" font-size="12" font-weight="600" text-anchor="middle">WebSocket</text>
  <text x="840" y="342" class="s" text-anchor="middle">auth token</text>

  <!-- ============ column 3: browser ============ -->
  <text x="880" y="172" class="cap">YOUR REAL BROWSER</text>
  <rect x="880" y="192" width="340" height="318" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <path d="M880 206 a14 14 0 0 1 14 -14 H1206 a14 14 0 0 1 14 14 V228 H880 z" fill="#21262d"/>
  <circle cx="900" cy="210" r="5" fill="#f85149"/>
  <circle cx="918" cy="210" r="5" fill="#d29922"/>
  <circle cx="936" cy="210" r="5" fill="#3fb950"/>
  <rect x="956" y="200" width="196" height="20" rx="10" fill="#0d1117"/>
  <text x="1054" y="214" font-size="11" text-anchor="middle" class="muted" style="fill:#8b949e">https://example.com/apply</text>
  <rect x="1168" y="198" width="40" height="24" rx="6" fill="#ffb347" fill-opacity="0.16" stroke="#ffb347"/>
  <text x="1188" y="214" font-size="11" font-weight="700" text-anchor="middle" style="fill:#ffb347">BF</text>

  <!-- page mock -->
  <rect x="900" y="248" width="130" height="12" rx="6" fill="#30363d"/>
  <rect x="900" y="276" width="130" height="22" rx="5" fill="#0d1117" stroke="#30363d"/>
  <rect x="900" y="308" width="130" height="22" rx="5" fill="#0d1117" stroke="#30363d"/>
  <rect x="900" y="344" width="92" height="30" rx="7" fill="#238636"/>
  <text x="946" y="364" font-size="13" font-weight="600" text-anchor="middle">Submit</text>
  <rect x="894" y="338" width="104" height="42" rx="10" fill="none" stroke="#ffb347" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- approval popup -->
  <g>
    <rect x="1040" y="244" width="166" height="126" rx="12" fill="#0d1117" stroke="#ffb347" stroke-width="2"/>
    <text x="1123" y="268" font-size="12" font-weight="700" text-anchor="middle" style="fill:#ffb347">HUMAN APPROVAL</text>
    <text x="1123" y="292" font-size="13" text-anchor="middle">Agent wants to</text>
    <text x="1123" y="310" font-size="13" font-weight="600" text-anchor="middle">submit this form</text>
    <rect x="1054" y="326" width="64" height="26" rx="7" fill="#238636"/>
    <text x="1086" y="344" font-size="12" font-weight="600" text-anchor="middle">Allow</text>
    <rect x="1128" y="326" width="64" height="26" rx="7" fill="#21262d" stroke="#f85149"/>
    <text x="1160" y="344" font-size="12" font-weight="600" text-anchor="middle" style="fill:#f85149">Deny</text>
  </g>
  <path d="M998 359 C1018 359 1020 340 1038 340" stroke="#ffb347" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow-o)"/>

  <!-- stop + capture -->
  <rect x="900" y="408" width="120" height="40" rx="20" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-width="2"/>
  <rect x="918" y="421" width="14" height="14" rx="2" fill="#f85149"/>
  <text x="976" y="433" font-size="14" font-weight="800" text-anchor="middle" style="fill:#f85149">STOP</text>
  <text x="1036" y="433" class="s">halts the agent until you resume</text>

  <circle cx="908" cy="476" r="5" fill="#3fb950"/>
  <text x="922" y="480" class="s">capturing network traffic · your tabs, your logins</text>

  <!-- daemon -> flow strip -->
  <path class="line" d="M620 510 V574" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

  <!-- ============ bottom flow ============ -->
  <text x="60" y="556" class="cap">FROM TRAFFIC TO CODE</text>

  <g>
    <rect x="60" y="578" width="200" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="160" y="605" class="h" text-anchor="middle">Browse and capture</text>
    <text x="160" y="625" class="s" text-anchor="middle">requests · headers · bodies</text>

    <rect x="300" y="578" width="200" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="400" y="605" class="h" text-anchor="middle">HAR + filters</text>
    <text x="400" y="625" class="s" text-anchor="middle">secrets redacted by default</text>

    <rect x="540" y="578" width="200" height="64" rx="12" fill="#161b22" stroke="#ffb347" stroke-width="2"/>
    <text x="640" y="605" class="h" text-anchor="middle">Endpoints + schemas</text>
    <text x="640" y="625" class="s" text-anchor="middle">auth · pagination · GraphQL</text>

    <rect x="780" y="578" width="200" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="880" y="605" class="h" text-anchor="middle">OpenAPI 3.1</text>
    <text x="880" y="625" class="s" text-anchor="middle">observed / inferred / hypothesis</text>

    <rect x="1020" y="578" width="200" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="1120" y="605" class="h" text-anchor="middle">API clients</text>
    <text x="1120" y="625" class="s" text-anchor="middle">Python · TypeScript · JS · PHP</text>
  </g>
  <path class="line" d="M262 610 H296" marker-end="url(#arrow)"/>
  <path class="line" d="M502 610 H536" marker-end="url(#arrow)"/>
  <path class="line" d="M742 610 H776" marker-end="url(#arrow)"/>
  <path class="line" d="M982 610 H1016" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text x="640" y="692" font-size="13" text-anchor="middle" class="muted" style="fill:#8b949e">Local-first  ·  human-in-the-loop  ·  redacted by default  ·  Firefox + Chrome  ·  MIT</text>
</svg>
